name: Update Kuramanime Token

on:
  # Manual saja (Actions -> Update Kuramanime Token -> Run workflow)
  workflow_dispatch:

concurrency:
  group: kuramanime-token
  cancel-in-progress: false

permissions: {}

jobs:
  # Job 1 menjalankan leviathan.js dari situs (kode luar), jadi dibuat tanpa akses tulis apa pun.
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Pakai repo variable MAIN_URL kalau ada, kalau tidak ambil dari mainUrl di KuramanimeProvider.kt
      - name: Resolve main URL
        id: main
        env:
          VAR_MAIN_URL: ${{ vars.MAIN_URL }}
        run: |
          url="$VAR_MAIN_URL"
          if [ -z "$url" ]; then
            url=$(grep -oP 'override var mainUrl = "\K[^"]+' KuramanimeProvider/src/main/kotlin/com/hexated/KuramanimeProvider.kt | head -n1 || true)
          fi
          echo "url=${url:-https://v20.kuramanime.ing}" >> "$GITHUB_OUTPUT"

      - name: Scrape token
        env:
          MAIN_URL: ${{ steps.main.outputs.url }}
          # Optional override:
          # LEVIATHAN_URL: ${{ secrets.LEVIATHAN_URL }}
          USER_AGENT: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
        run: node kuramanime-scraper/scrape-token.js --json --out token.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kuramanime-token
          path: token.json
          retention-days: 7
          if-no-files-found: error

  # Job 2 hanya membaca token.json (divalidasi ketat), lalu update provider + bump versi + commit.
  update:
    needs: scrape
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download token
        uses: actions/download-artifact@v4
        with:
          name: kuramanime-token

      - name: Update provider
        id: update
        run: node kuramanime-scraper/update-provider.js token.json

      - name: Commit and push
        if: steps.update.outputs.changed == 'true'
        env:
          NEW_VERSION: ${{ steps.update.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add KuramanimeProvider/src/main/kotlin/com/hexated/KuramanimeProvider.kt KuramanimeProvider/build.gradle.kts
          git commit -m "Kuramanime: update authorization token" -m "Bump version to $NEW_VERSION"
          git push

      # Push dari GITHUB_TOKEN tidak memicu workflow lain, jadi build dipanggil manual (kalau ada build.yml)
      - name: Trigger build
        if: steps.update.outputs.changed == 'true' && hashFiles('.github/workflows/build.yml') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref_name }}
        run: gh workflow run build.yml --ref "$REF"
